<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>data-doctor</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66;
    --line: #e4e4df; --accent: #2f6f4f; --accent-ink: #ffffff; --chip: #eef2ee;
    --warn: #8a5a00; --ok: #2f6f4f; --bad: #9a2f2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1f2123; --ink: #ececec; --muted: #9a9a95;
      --line: #2e3033; --accent: #5fae84; --accent-ink: #10110f; --chip: #24282a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 24px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 24px; }
  .panel { background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 20px; }
  textarea { width: 100%; min-height: 120px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    color: var(--ink); font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
  select, input[type=text] { padding: 7px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 13px; }
  button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent);
    color: var(--accent-ink); font-weight: 600; cursor: pointer; font-size: 14px; }
  button.ghost { background: var(--chip); color: var(--ink); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 0 0 10px; }
  .card { border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    margin-bottom: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .chip { display: inline-block; background: var(--chip); color: var(--muted);
    border-radius: 999px; padding: 2px 9px; font-size: 11px; margin-right: 6px; }
  .kv { margin: 6px 0; } .kv b { color: var(--muted); font-weight: 600;
    display: inline-block; min-width: 64px; }
  .fix { background: var(--chip); border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
  a { color: var(--accent); }
  .why { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .fb { margin-top: 8px; } .fb button { font-size: 12px; padding: 5px 10px; margin-right: 6px; }
  .muted { color: var(--muted); } .empty { color: var(--muted); padding: 8px 0; }
  .bankrow { display: flex; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .bankrow:last-child { border-bottom: 0; }
  footer { max-width: 860px; margin: 0 auto; padding: 0 24px 40px; color: var(--muted);
    font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>data-doctor</h1>
  <p>Paste a data-pipeline error. Get the known fix, with its source and how sure it is.</p>
</header>
<main>
  <div class="panel">
    <textarea id="err" placeholder="Paste an Airflow, dbt, Spark, or Iceberg error here..."></textarea>
    <div class="row">
      <select id="engine">
        <option value="">auto-detect engine</option>
        <option value="airflow">airflow</option>
        <option value="dbt">dbt</option>
        <option value="spark">spark</option>
        <option value="iceberg">iceberg</option>
      </select>
      <input type="text" id="version" placeholder="version (optional)" size="14" />
      <button id="go">Diagnose</button>
    </div>
    <div id="results" style="margin-top:16px"></div>
  </div>

  <div class="panel">
    <h2>Browse the bank</h2>
    <div class="row">
      <input type="text" id="q" placeholder="search the bank..." style="flex:1" />
      <select id="bankengine">
        <option value="">all engines</option>
        <option value="airflow">airflow</option>
        <option value="dbt">dbt</option>
        <option value="spark">spark</option>
        <option value="iceberg">iceberg</option>
      </select>
    </div>
    <div id="bank" style="margin-top:12px"></div>
  </div>
</main>
<footer id="stats"></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => (s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function diagnose() {
  const text = $("err").value.trim();
  if (!text) return;
  $("go").disabled = true; $("results").innerHTML = '<p class="muted">Matching...</p>';
  try {
    const r = await fetch("/api/diagnose", { method: "POST",
      headers: {"content-type": "application/json"},
      body: JSON.stringify({ text, engine: $("engine").value, version: $("version").value }) });
    const data = await r.json();
    renderResults(data);
  } catch (e) { $("results").innerHTML = '<p class="muted">Request failed.</p>'; }
  $("go").disabled = false;
}

function renderResults(data) {
  const head = `<p class="muted">engine: ${esc(data.engine)} · exception: ${esc(data.exception || "n/a")}</p>`;
  if (!data.matches || !data.matches.length) {
    $("results").innerHTML = head + '<p class="empty">No known match. If you solve it, add it to the bank.</p>';
    return;
  }
  $("results").innerHTML = head + data.matches.map(m => `
    <div class="card">
      <h3>${esc(m.title)}</h3>
      <div><span class="chip">${esc(m.engine)}</span>
        ${m.version_range ? `<span class="chip">applies to ${esc(m.version_range)}</span>` : ""}
        <span class="chip">${esc(m.status)} · conf ${m.confidence}</span></div>
      ${m.root_cause ? `<div class="kv"><b>cause</b> ${esc(m.root_cause)}</div>` : ""}
      <div class="fix"><b>fix</b> ${esc(m.fix)}</div>
      ${m.verification ? `<div class="kv"><b>verify</b> ${esc(m.verification)}</div>` : ""}
      ${m.source ? `<div class="kv"><b>source</b> <a href="${esc(m.source)}" target="_blank" rel="noopener">${esc(m.source)}</a></div>` : ""}
      <div class="why">why: ${esc((m.why || []).join("; "))} · score ${m.score}</div>
      <div class="fb" data-id="${esc(m.id)}">
        <button class="ghost fbw">this fixed it</button>
        <button class="ghost fbf">did not fix it</button>
      </div>
    </div>`).join("");
  document.querySelectorAll(".fb").forEach(el => {
    el.querySelector(".fbw").onclick = () => sendFeedback(el.dataset.id, true, el);
    el.querySelector(".fbf").onclick = () => sendFeedback(el.dataset.id, false, el);
  });
}

async function sendFeedback(id, worked, el) {
  const r = await fetch("/api/feedback", { method: "POST",
    headers: {"content-type": "application/json"}, body: JSON.stringify({ id, worked }) });
  const d = await r.json();
  el.innerHTML = `<span class="muted">recorded · confidence ${d.confidence}</span>`;
  loadStats();
}

async function loadBank() {
  const q = encodeURIComponent($("q").value), engine = encodeURIComponent($("bankengine").value);
  const r = await fetch(`/api/bank?q=${q}&engine=${engine}`);
  const d = await r.json();
  $("bank").innerHTML = d.entries.length ? d.entries.map(e => `
    <div class="bankrow"><span><b>${esc(e.title)}</b><br>
      <span class="muted">${esc(e.engine)}${e.version_range ? " · " + esc(e.version_range) : ""} · ${esc(e.status)}</span></span>
      <span class="muted">conf ${e.confidence}</span></div>`).join("")
    : '<p class="empty">No entries.</p>';
}

async function loadStats() {
  const d = await (await fetch("/api/stats")).json();
  const byEngine = Object.entries(d.by_engine || {}).map(([k, v]) => `${k} ${v}`).join(", ");
  $("stats").textContent = `Bank: ${d.total} entries (${d.verified} verified) · ${byEngine}`
    + ` · feedback ${d.feedback_count}, fix-worked rate ${d.fix_worked_rate ?? "n/a"}`;
}

$("go").onclick = diagnose;
$("err").addEventListener("keydown", e => { if (e.metaKey && e.key === "Enter") diagnose(); });
let t; $("q").addEventListener("input", () => { clearTimeout(t); t = setTimeout(loadBank, 200); });
$("bankengine").addEventListener("change", loadBank);
loadBank(); loadStats();
</script>
</body>
</html>
