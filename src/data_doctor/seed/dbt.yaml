  title: Timestamp snapshot is missing updated_at
  signature: "must specify an updated_at configuration"
  symptom: "A timestamp strategy snapshot fails because it must specify an
    updated_at configuration."
  root_cause: "The timestamp strategy detects changes from a column that
    increases when the row changes. The config names that column updated_at."
  fix: "Set strategy to timestamp, unique_key, and updated_at to a real timestamp
    column in the query. If you meant to hash columns instead, switch strategy to
    check and set check_cols."
  verification: "dbt snapshot completes and a changed updated_at value produces a
