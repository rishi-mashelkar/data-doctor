- id: dbt-snapshot-check-cols
  engine: dbt
  title: Check snapshot is missing check_cols
  signature: "must specify a check_cols configuration"
  symptom: "dbt snapshot fails because a check strategy snapshot must specify a
    check_cols configuration."
  root_cause: "The check strategy stores a row when one of the listed columns
    changes. Without check_cols, dbt has nothing to compare."
  fix: "Set strategy to check and check_cols to a list of columns, or to all.
    Keep unique_key. Do not set updated_at unless you switch strategy to
    timestamp."
  verification: "dbt snapshot builds the snapshot and dbt_scd_id is populated."
  version_range: ""
  source: "https://docs.getdbt.com/docs/build/snapshots"
  confidence: 0.7
