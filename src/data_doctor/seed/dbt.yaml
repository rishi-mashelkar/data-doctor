- id: dbt-dag-cycle
  engine: dbt
  title: Found a cycle in the model graph
  signature: "Found a cycle model ref depends on itself"
  symptom: "dbt fails at parse time with Found a cycle and a chain of model names
    that loops back."
  root_cause: "Two or more refs form a loop. A model refs another that refs it
    back, sometimes through a macro or a hook that calls ref on the same model."
  fix: "Break the loop. Point one side at a source instead of a ref, or split the
    shared logic so the edges only go one way. In a hook that builds on the
    current model, use this instead of ref of the same model."
  verification: "dbt parse succeeds and the cycle message is gone."
  version_range: ""
  source: "https://docs.getdbt.com/guides/debug-errors"
  confidence: 0.7
  status: reported
  scope: public
  tags: [compile, ref, graph]

- id: dbt-contract-mismatch
  engine: dbt
  title: Enforced model contract failed
  signature: "Compilation Error enforced contract that failed data_type mismatch_reason assert_columns_equivalent"
  symptom: "dbt compile fails saying the model has an enforced contract that
    failed, and prints a column whose type does not match."
  root_cause: "contract.enforced is true, so the columns the model returns must
    match the YAML name and data_type. A cast, a missing column, or an extra
    column fails the check."
  fix: "Make the SQL and the YAML list the same columns, with data_type values
    the warehouse accepts. dbt aliases common names such as string. Set
    alias_types to false if you need the warehouse type written exactly as you
    typed it. On an incremental model, set on_schema_change to append_new_columns
    or fail."
  verification: "dbt build --select the model runs and the contract table in the
    error is gone."
  version_range: ">=1.5"
  source: "https://docs.getdbt.com/reference/resource-configs/contract"
  confidence: 0.72
  status: reported
  scope: public
  tags: [contract, schema, compile]

- id: dbt-env-var-missing
