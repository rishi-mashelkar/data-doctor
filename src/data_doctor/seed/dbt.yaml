- id: dbt-dispatch-missing-package
  engine: dbt
  title: Dispatch cannot find a package in the search order
  signature: "In dispatch: Could not find package 'my_project'"
  symptom: "Compile fails and says that dispatch could not find a package. The name
    is one listed in search_order."
  root_cause: "A package in the dispatch search order defines no macros. dbt only
    searches packages that contain macros."
  fix: "Remove that package from search_order, or add a macro to the package. Keep
    the project name in the list only when the project defines macros. Then
    compile again."
  verification: "dbt compile no longer reports that missing package."
