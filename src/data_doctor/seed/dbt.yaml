- id: dbt-utils-surrogate-key-replaced
  engine: dbt
  title: dbt_utils.surrogate_key has been replaced
  signature: "The new macro treats null values differently to empty strings"
  symptom: "After a dbt_utils upgrade, compile fails or warns that surrogate_key
    has been replaced by generate_surrogate_key."
  root_cause: "dbt_utils 1.0 removed the old macro. The new one treats null and
    an empty string as different values, so existing keys can change."
  fix: "Replace dbt_utils.surrogate_key with dbt_utils.generate_surrogate_key and
    pass one list of columns. To keep the old null behavior, set
    surrogate_key_treat_nulls_as_empty_strings true under vars in dbt_project.yml.
    Do that when the keys are already stored in incremental models or snapshots."
  verification: "dbt compile no longer mentions surrogate_key. A sample key
    matches the previous value if you kept the old null behavior."
  version_range: ""
  source: "https://docs.getdbt.com/docs/dbt-versions/dbt-upgrade/Older%20versions/upgrading-to-dbt-utils-v1.0"
  confidence: 0.7
  status: reported
  scope: public
  tags: [packages, macros]

- id: dbt-snowflake-nondeterministic-merge
  engine: dbt
  title: Snowflake merge fails as nondeterministic
  signature: "Duplicate row detected during DML action"
  symptom: "An incremental model on Snowflake fails during merge. The warehouse
    reports a nondeterministic merge or a duplicate row detected during the DML
    action."
  root_cause: "The merge strategy updates by unique_key. Snowflake rejects the
    statement when that key matches more than one source row."
  fix: "Deduplicate the source so unique_key is one row, or set
    incremental_strategy to delete+insert. Confirm the key has no nulls, because
    null keys fail to match and insert extra rows."
  verification: "dbt run --select the model completes, and a count of the
    unique_key equals a count of distinct values."
  version_range: ""
  source: "https://docs.getdbt.com/reference/resource-configs/snowflake-configs"
  confidence: 0.68
  status: reported
  scope: public
  tags: [incremental, snowflake, merge]

