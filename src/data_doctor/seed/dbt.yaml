  symptom: "dbt compile or run fails saying a model depends on a node named X which
    was not found."
  root_cause: "A ref points at a model name that does not exist. Usual causes are a
    typo, a renamed or deleted model, or a model in a package that is not
    installed."
  fix: "Check the ref name against the model file name, not the file path. If the
    model was renamed, update every ref. If it lives in a package, run dbt deps so
    the package is installed. Then dbt compile to confirm the graph resolves."
  verification: "dbt compile succeeds and dbt ls shows the referenced model."
