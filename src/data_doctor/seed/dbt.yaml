- id: dbt-snapshot-not-snapshot-table
  engine: dbt
  title: The snapshot target is not a snapshot table
  signature: "Snapshot target is not a snapshot table (missing dbt_scd_id, dbt_valid_from, dbt_valid_to)"
  symptom: "dbt snapshot stops because the target table is not a snapshot table.
    The message lists missing columns, including dbt_scd_id."
  root_cause: "That table was created as a normal table, so it has none of the
    snapshot meta columns. dbt will not append history to it."
  fix: "Drop the target table. Run dbt snapshot so dbt creates a new table with the
    meta columns. Do not set materialized to table on the snapshot."
  verification: "dbt snapshot completes, and the table contains dbt_scd_id,
    dbt_valid_from, and dbt_valid_to."
  version_range: ""
  source: "https://docs.getdbt.com/faqs/Snapshots/snapshot-target-is-not-a-snapshot-table"
  confidence: 0.73
  status: reported
  scope: public
  tags: [snapshots]

- id: dbt-snapshot-materialized-config
  engine: dbt
  title: A snapshot must be materialized as snapshot
  signature: "A snapshot must have a materialized value of 'snapshot'"
  symptom: "dbt raises a Parsing Error on a snapshot file. It says the materialized
    value must be snapshot."
  root_cause: "The snapshot sets materialized to table or to another type. Since
    dbt 1.4, dbt rejects that and will not build the snapshot as a plain table."
  fix: "Set materialized to snapshot, or delete that config so the default stands.
    Keep the strategy and unique_key. Then run dbt parse."
  verification: "dbt parse accepts the snapshot file."
  version_range: ""
  source: "https://docs.getdbt.com/faqs/Snapshots/snapshot-target-is-not-a-snapshot-table"
  confidence: 0.70
  status: reported
  scope: public
  tags: [snapshots, parse]

