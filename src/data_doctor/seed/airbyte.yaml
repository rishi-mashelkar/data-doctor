- id: airbyte-postgres-cdc-lsn-behind
  engine: airbyte
  title: CDC offset is behind the replication slot
  signature: "Saved offset is before Replication slot confirmed_flush_lsn Airbyte will trigger sync from scratch"
  symptom: "A Postgres CDC sync that should be incremental reloads the table. The log
    says the saved offset is before the slot's confirmed_flush_lsn."
  root_cause: "Postgres has already discarded the WAL the offset points at. A busy
    database can purge pg_wal. Or the source acknowledged the WAL and the
    destination then failed, so the next read asks for a record that is gone."
  fix: "Sync more often so the slot does not fall behind. Raise wal_keep_size so
    Postgres keeps more WAL. Then reset the connection so Airbyte takes a fresh
    snapshot. If you stop using the connection, drop the replication slot or the
    WAL will fill the disk."
  verification: "The next sync after the snapshot logs incremental changes and
    does not repeat the confirmed_flush_lsn message."
  version_range: ""
  source: "https://docs.airbyte.com/integrations/sources/postgres/postgres-troubleshooting"
  confidence: 0.7
  status: reported
  scope: public
  tags: [cdc, postgres, wal]

- id: airbyte-postgres-hot-standby-conflict
  engine: airbyte
  title: PSQLException - replica cancels the sync
  signature: "FATAL: terminating connection due to conflict with recovery"
  symptom: "A sync from a Postgres hot standby dies with FATAL: terminating
    connection due to conflict with recovery."
  root_cause: "The primary vacuumed rows the replica query still needed. The
    replica cancels that query after max_standby_streaming_delay, and the default
    wait is too short for a real sync."
  fix: "Set hot_standby_feedback=on on the replica so the primary keeps the rows
    until the sync finishes. WAL on the primary will grow while the replica is
    busy. Sync from the primary if you cannot set that."
  verification: "The sync runs to completion and the replica log has no
    conflict with recovery cancel."
  version_range: ""
  source: "https://docs.airbyte.com/integrations/sources/postgres/postgres-troubleshooting"
  confidence: 0.68
  status: reported
  scope: public
  tags: [postgres, replica, cdc]

