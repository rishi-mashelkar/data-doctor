- id: airbyte-postgres-xmin-wraparound
  engine: airbyte
  title: Xmin wraparound blocks xmin replication
  signature: "We detected XMIN transaction wraparound in the database, which makes this sync option inefficient and can lead to higher credit consumption. Please change the replication method to CDC or cursor based."
  symptom: "The Postgres source check fails and says it detected XMIN transaction
    wraparound. It tells you to change the replication method."
  root_cause: "xmin is a 32-bit transaction id. After it wraps, it no longer
    increases, so Airbyte cannot use it as a cursor and may resync rows it
    already copied."
  fix: "Change the replication method to CDC, or use a cursor column. Recreate
    the streams after the switch so the first run takes a snapshot."
  verification: "The source check passes and the next sync does not report xmin
    wraparound."
