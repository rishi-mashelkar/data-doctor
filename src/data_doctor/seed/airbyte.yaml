- id: airbyte-mysql-cdc-binlog-purged
  engine: airbyte
  title: MySQL CDC reloads because the binlog offset is gone
  signature: "Saved offset no longer present on the server, Airbyte is going to trigger a sync from scratch"
  symptom: "A MySQL CDC sync that should be incremental reloads the table. The log
    says the saved offset is no longer present on the server."
  root_cause: "MySQL deleted the binary logs the offset points at. A busy server
    can expire them before the next sync. On Amazon RDS the retention hours
    often default to 0."
  fix: "Sync more often, and on MySQL raise binlog_expire_logs_seconds so logs
    last seven days. That is the Airbyte recommendation. On Amazon RDS, set
    binlog retention hours to at least 24."
  verification: "The next sync after the reload stays incremental and does not
    repeat the saved offset message."
  version_range: ""
  source: "https://docs.airbyte.com/integrations/sources/mysql/mysql-troubleshooting"
  confidence: 0.72
