- id: airbyte-clickhouse-async-insert-check
  engine: airbyte
  title: ClickHouse check writes no rows when async insert is on
  signature: "Failed to insert expected rows into check table. Actual written: 0"
  symptom: "The ClickHouse destination check fails. It inserted no rows into
    the check table."
  root_cause: "async_insert is on for the Airbyte user. The check reads before
    ClickHouse flushes the async buffer, so the written count stays 0."
  fix: "Set async_insert to 0 for the Airbyte user. Run ALTER USER
    airbyte_user SETTINGS async_insert = 0."
  verification: "The destination check passes and the check table row count is
