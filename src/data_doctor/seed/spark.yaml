- id: spark-ansi-arithmetic-overflow
  engine: spark
  title: SparkArithmeticException - integer overflow
  signature: "SparkArithmeticException ARITHMETIC_OVERFLOW integer overflow try_add spark.sql.ansi.enabled"
  symptom: "A query fails with SparkArithmeticException [ARITHMETIC_OVERFLOW]
    integer overflow, and the message suggests try_add."
  root_cause: "ANSI mode is on, so overflow throws instead of wrapping. Spark 4.0
    enables spark.sql.ansi.enabled by default. On Spark 3.4 and later the same
    exception is raised only when that setting is true."
  fix: "Widen the column, for example int to bigint, which keeps the value.
    try_add, try_subtract, or try_multiply return null on overflow when a null is
    acceptable. Set spark.sql.ansi.enabled to false only as a stopgap, because the
    old wraparound hides bad data."
  verification: "The query returns the widened value, or try_add returns null,
    and SparkArithmeticException is gone."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/sql-ref-ansi-compliance.html"
  confidence: 0.7
  status: reported
  scope: public
  tags: [ansi, arithmetic, sql]

- id: spark-implicit-cartesian
  engine: spark
  title: AnalysisException - implicit cartesian product
  signature: "AnalysisException Detected implicit cartesian product Join condition is missing crossJoin"
  symptom: "A join fails with AnalysisException: Detected implicit cartesian
    product, and says the join condition is missing or trivial."
  root_cause: "The join has no real key, so Spark refuses the cross product.
    spark.sql.crossJoin.enabled defaults to false."
  fix: "Add the missing ON condition. If a cross join is what you want, write
    CROSS JOIN. Set spark.sql.crossJoin.enabled to true only when the product is
    intentional and small enough to run."
  verification: "The join explains without the cartesian analysis error and
    returns the expected row count."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/sql-ref-syntax-qry-select-join.html"
  confidence: 0.7
  status: reported
  scope: public
  tags: [sql, join]

- id: spark-overwrite-same-path
  engine: spark
  title: Cannot overwrite a path that is also being read
  signature: "AnalysisException UNSUPPORTED_OVERWRITE Cannot overwrite a path that is also being read from"
  symptom: "A write fails with AnalysisException. The message says it cannot
    overwrite a path that is also being read from, or UNSUPPORTED_OVERWRITE."
  root_cause: "The job reads a path and writes it back in overwrite mode. Spark
    blocks that so the read files are not deleted out from under the job."
  fix: "Write to a different path, then replace the old path after the write
    succeeds. For a DataFrame, cache it and run an action such as count so the
    read finishes before the overwrite. An INSERT OVERWRITE of a table you also
    select from has the same limit. Write a staging table, then swap."
  verification: "The write completes and a read of the destination shows the new
    data."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/sql-error-conditions.html#unsupported-overwrite-path"
  confidence: 0.66
  status: reported
  scope: public
  tags: [write, paths]

- id: spark-python-worker-version
  engine: spark
  title: Python on the workers does not match the driver
  signature: "org.apache.spark.SparkException PySparkRuntimeError PYTHON_VERSION_MISMATCH Python in worker has different version than that in driver PYSPARK_PYTHON PYSPARK_DRIVER_PYTHON"
  symptom: "The job fails immediately because Python in the worker has a
    different version than Python in the driver."
  root_cause: "The driver and the executors are not on the same Python minor
    version. PYSPARK_PYTHON on the workers and PYSPARK_DRIVER_PYTHON on the
    driver point at different interpreters."
  fix: "Point PYSPARK_PYTHON and PYSPARK_DRIVER_PYTHON at the same interpreter
    on every node. Restart the workers after the change so they do not keep the
    old one."
  verification: "The job gets past the first Python task, and the worker log
    shows the same Python version as the driver."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/configuration.html"
  confidence: 0.72
  status: reported
  scope: public
  tags: [python, cluster, config]

- id: spark-divide-by-zero
  engine: spark
  title: SparkArithmeticException DIVIDE_BY_ZERO
  signature: "org.apache.spark.SparkArithmeticException DIVIDE_BY_ZERO Division by zero try_divide divisor"
  symptom: "A query fails with SparkArithmeticException DIVIDE_BY_ZERO when a
    divisor is zero."
  root_cause: "ANSI mode is on, so division by zero throws. Spark 4.0 turns ANSI
    on by default. On 3.4 and later the same error fires only when
