    partition with mapPartitions locally."
  verification: "The Python stage completes and the worker process stays up for
    the whole task."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/configuration.html"
  confidence: 0.62
  status: reported
  scope: public
  tags: [python, worker]

- id: spark-s3-access-denied
  engine: spark
  title: S3 responds 403 Access Denied
  signature: "org.apache.spark.SparkException com.amazonaws.services.s3.model.AmazonS3Exception Status Code 403 Access Denied"
  symptom: "A read or write fails with AmazonS3Exception, status 403, Access
    Denied."
  root_cause: "The credentials are present but not allowed to use that bucket or
    key. A missing s3:GetObject, s3:ListBucket, or a condition on encryption
    headers looks the same. A wrong path is a 404, not a 403."
  fix: "Confirm the role the executors assume, not only the driver. Allow
    ListBucket on the bucket and GetObject or PutObject on the prefix. If the
    bucket requires SSE-KMS, grant the key and send the encryption header the
    bucket policy expects."
  verification: "A list and a read of one object with the same credentials
    succeed from an executor."
