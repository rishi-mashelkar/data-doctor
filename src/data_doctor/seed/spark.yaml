- id: spark-cast-invalid-input
  engine: spark
  title: CAST_INVALID_INPUT on a bad cast
  signature: "SparkNumberFormatException CAST_INVALID_INPUT try_cast malformed"
  symptom: "A cast fails with CAST_INVALID_INPUT. SparkNumberFormatException says
    the value is malformed for the target type."
  root_cause: "ANSI mode rejects a cast that older Spark turned into null. A
    string that is not a number, or a timestamp that does not match the pattern,
    throws."
