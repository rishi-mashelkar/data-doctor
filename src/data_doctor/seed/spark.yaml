- id: spark-dynamic-partition-strict
  engine: spark
  title: Dynamic partition strict mode
  signature: "AnalysisException Dynamic partition strict mode requires at least one static partition column hive.exec.dynamic.partition.mode"
  symptom: "A write into a partitioned Hive table fails. Dynamic partition strict
    mode requires at least one static partition column."
  root_cause: "hive.exec.dynamic.partition.mode defaults to strict. An INSERT
    that sets every partition column from data, with no static partition, is
    rejected."
  fix: "Add a static partition to the INSERT, or set
    hive.exec.dynamic.partition.mode to nonstrict for that write. Also set
    hive.exec.dynamic.partition to true if dynamic partitions are still off."
  verification: "The insert lands rows and SHOW PARTITIONS lists the new
    partitions."
