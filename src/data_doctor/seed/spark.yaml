  scope: public
  tags: [s3, iam, credentials]

- id: spark-multiple-sparkcontext
  engine: spark
  title: A second SparkContext in one JVM
  signature: "org.apache.spark.SparkException Only one SparkContext may be running in this JVM spark.driver.allowMultipleContexts"
  symptom: "Creating a session fails with Only one SparkContext may be running
    in this JVM."
  root_cause: "A second SparkContext was started while the first is still alive.
    Notebooks and tests do this when they call SparkContext() again instead of
    reusing the session."
  fix: "Build the session with SparkSession.builder.getOrCreate and stop using
    the existing one. Stop the old context before starting a new one in a test.
    spark.driver.allowMultipleContexts hides the check and leaves two contexts
    sharing one JVM."
  verification: "A second getOrCreate returns the same session, and the app
    starts with one context."
