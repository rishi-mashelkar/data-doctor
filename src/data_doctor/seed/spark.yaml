  source: "https://spark.apache.org/docs/latest/rdd-programming-guide.html"
  confidence: 0.7
  status: reported
  scope: public
  tags: [sparkcontext, session]

- id: spark-streaming-checkpoint-missing
  engine: spark
  title: Structured streaming query has no checkpoint
  signature: "org.apache.spark.sql.AnalysisException checkpointLocation must be specified either through option checkpointLocation or spark.sql.streaming.checkpointLocation"
  symptom: "A streaming query fails because checkpointLocation must be
    specified, either as an option or as spark.sql.streaming.checkpointLocation."
  root_cause: "Structured streaming stores offsets and state in a checkpoint.
    A query with state, or a sink that requires it, refuses to start without a
    path."
  fix: "Set option checkpointLocation to a durable directory unique to this
    query. Do not share one checkpoint between two queries. To move or reset,
    stop the query and use a new empty directory only when replaying from the
    source is acceptable."
  verification: "The query stays active and the checkpoint directory contains
    offsets and commits."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/streaming/apis-on-dataframes-and-datasets.html#recovering-from-failures-with-checkpointing"
  confidence: 0.72
  status: reported
  scope: public
  tags: [streaming, checkpoint]

- id: spark-jdbc-no-driver
