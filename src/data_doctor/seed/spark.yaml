- id: spark-kafka-offset-out-of-range
  engine: spark
  title: Kafka offset is out of range
  signature: "org.apache.kafka.clients.consumer.OffsetOutOfRangeException Offsets out of range with no configured reset policy failOnDataLoss"
  symptom: "A Kafka source fails with OffsetOutOfRangeException. The stored
    offset is no longer in the topic."
  root_cause: "The checkpoint or startingOffsets points at an offset the broker
    deleted, usually because retention moved the log start ahead of the consumer."
  fix: "For a new query, set startingOffsets to earliest or latest. For a query
    that already has a checkpoint, the checkpoint wins over startingOffsets. If
    losing the gap is acceptable, set failOnDataLoss to false. Otherwise recreate
    the checkpoint and accept a replay from earliest."
  verification: "The stream starts and the source progress shows offsets inside
    the current log range."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/streaming/structured-streaming-kafka-integration.html"
  confidence: 0.68
  status: reported
  scope: public
  tags: [kafka, streaming, offsets]

- id: spark-window-requires-order
  engine: spark
  title: Window function has no ORDER BY
  signature: "AnalysisException WINDOW_FUNCTION_FRAME_NOT_ORDERED Window function requires the window to be ordered ORDER BY clause"
  symptom: "AnalysisException says a window function requires the window to be
    ordered, and asks for an ORDER BY clause."
  root_cause: "rank, dense_rank, row_number, and lag need an order inside OVER.
    A window that only partitions is not ordered."
  fix: "Add ORDER BY inside the OVER clause. Partition by the group, and order
    by the column that defines the sequence. A range frame also needs that
    order."
  verification: "The select returns and the ranking repeats per partition in the
    order you set."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/sql-error-conditions.html#window-function-frame-not-ordered"
  confidence: 0.7
  status: reported
  scope: public
  tags: [sql, window]
