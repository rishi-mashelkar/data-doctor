- id: spark-broadcast-timeout
  engine: spark
  title: Broadcast join exceeds broadcastTimeout
  signature: "org.apache.spark.SparkException Could not execute broadcast spark.sql.broadcastTimeout spark.sql.autoBroadcastJoinThreshold"
  symptom: "The job fails with SparkException: Could not execute broadcast in
    time, citing spark.sql.broadcastTimeout."
  root_cause: "The broadcast side is larger or slower than the timeout, which
    defaults to 300 seconds. autoBroadcastJoinThreshold still chooses a broadcast
    hash join."
  fix: "Filter or aggregate the small side before the join. Raise
    spark.sql.broadcastTimeout if the side is legitimately slow to collect. Set
    spark.sql.autoBroadcastJoinThreshold to -1 to force a shuffle join when the
    side is not small."
  verification: "The join finishes and the UI shows either a completed broadcast
    or a shuffle join."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/configuration.html"
  confidence: 0.66
  status: reported
  scope: public
  tags: [join, broadcast, timeout]

- id: spark-python-worker-crashed
  engine: spark
  title: Python worker exited unexpectedly
  signature: "org.apache.spark.SparkException Python worker exited unexpectedly crashed"
  symptom: "A Python task fails with Python worker exited unexpectedly
    (crashed). The executor log may show a native signal before it."
  root_cause: "The worker process died. Typical causes are a native library
