- id: spark-kryo-buffer-overflow
  engine: spark
  title: Kryo serializer buffer overflow
  signature: "org.apache.spark.SparkException Kryo serialization failed Buffer overflow com.esotericsoftware.kryo.KryoException spark.kryoserializer.buffer.max"
  symptom: "The job fails with KryoException: Buffer overflow while serializing a
    task or a shuffle block."
  root_cause: "spark.serializer is Kryo and one object is larger than
    spark.kryoserializer.buffer.max. The default max is 64m. This is not the
    Task not serializable failure, which fires before any bytes are written."
  fix: "Raise spark.kryoserializer.buffer.max above the object size. Prefer
    smaller records if one row holds a huge blob. Leave spark.kryoserializer.buffer
    at its small default so tasks do not reserve the max up front."
  verification: "The stage completes and the Kryo overflow is gone from the
    executor log."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/configuration.html"
  confidence: 0.68
  status: reported
  scope: public
  tags: [serialization, kryo, config]

- id: spark-fetch-failed-shuffle
  engine: spark
  title: FetchFailedException during shuffle
  signature: "org.apache.spark.SparkException org.apache.spark.shuffle.FetchFailedException Too large frame"
  symptom: "A shuffle read fails with FetchFailedException and the message Too
    large frame."
  root_cause: "The shuffle block is larger than the network frame limit, about 2g.
    Spark tries to fetch that block into memory and the frame is rejected. This
    is not an executor out of memory failure."
  fix: "Lower spark.network.maxRemoteBlockSizeFetchToMem so the block fetches to
    disk. Keep the value under 2g. Split the skewed partition that wrote the
    block."
  verification: "The stage completes without a new fetch failure, and the
    shuffle read in the UI finishes."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/configuration.html"
  confidence: 0.64
  status: reported
  scope: public
  tags: [shuffle, network]

- id: spark-max-result-size
  engine: spark
  title: Driver maxResultSize exceeded
  signature: "org.apache.spark.SparkException Total size of serialized results is bigger than spark.driver.maxResultSize"
  symptom: "The job aborts because the total size of serialized results of the
    tasks is bigger than spark.driver.maxResultSize."
  root_cause: "An action such as collect, toPandas, or a broadcast collects
    results onto the driver. The default cap is 1g. This is the driver limit, not
    an executor out of memory."
  fix: "Stop collecting the full set. Write the output from the executors, or
    aggregate first. Raise spark.driver.maxResultSize only when the driver has
    memory for that total. A broadcast of a large side also trips this cap."
  verification: "The action returns, and the driver log no longer reports
    maxResultSize."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/configuration.html"
  confidence: 0.7
  status: reported
  scope: public
  tags: [driver, memory, collect]

- id: spark-codegen-64kb
  engine: spark
  title: Whole-stage codegen method exceeds 64 KB
  signature: "org.apache.spark.SparkException org.codehaus.janino.JaninoRuntimeException Code of method grows beyond 64 KB"
  symptom: "The job fails in Janino. Code of a method in GeneratedIterator or
    SpecificUnsafeProjection grows beyond 64 KB."
  root_cause: "Whole-stage codegen, on by default as spark.sql.codegen.wholeStage,
    compiles a huge plan into one Java method. The JVM class format limits a
    method to 64 KB."
  fix: "Split the plan. checkpoint or persist and count, then continue in a
    second action, so each method stays under the limit. Setting
    spark.sql.codegen.wholeStage to false also avoids the compile, at a CPU cost."
  verification: "The action completes and the Janino 64 KB error is gone."
  version_range: ""
  source: "https://spark.apache.org/docs/latest/api/scala/org/apache/spark/metrics/source/CodegenMetrics$.html"
  confidence: 0.7
  status: reported
  scope: public
  tags: [codegen, sql]

